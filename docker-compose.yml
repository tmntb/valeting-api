name: valeting

services:
  api:
    build:
        context: .
        dockerfile: Api/Dockerfile
    ports:
        - "8080:8080"
    container_name: api
    depends_on: 
        sqlserver:
          condition: service_healthy
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - JWT_KEY=${JWT_KEY}
      - PK_RPID=${PK_RPID}
      - PK_RPNAME=${PK_RPNAME}
      - PK_ORIGINS=${PK_ORIGINS}

volumes:
  sqlserver_data:
