name: valeting

services:
  api:
    build:
        context: .
        dockerfile: Api/Dockerfile
    ports:
        - "8080:8080"
    container_name: api
    depends_on: 
        sqlserver:
          condition: service_healthy
        redis:
          condition: service_healthy
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - JWT_KEY=${JWT_KEY}
      - PK_RPID=${PK_RPID}
      - PK_RPNAME=${PK_RPNAME}
      - PK_ORIGINS=${PK_ORIGINS}
      - PASSWORD_RESET_BASE_URL=${PASSWORD_RESET_BASE_URL}
      - PASSWORD_RESET_LIFETIME_MINUTES=${PASSWORD_RESET_LIFETIME_MINUTES}
      - RESEND_API_KEY=${RESEND_API_KEY}
  
  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  sqlserver_data:
  redis_data:
