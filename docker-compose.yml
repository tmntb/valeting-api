name: valeting

services:
  api:
    build:
        context: .
        dockerfile: Api/Dockerfile
    ports:
        - "8080:8080"
    container_name: api
    depends_on: 
        sqlserver:
          condition: service_healthy
    environment:
      - SA_PASSWORD=${SA_PASSWORD}
      - JWT_KEY=${JWT_KEY}
      - Passkeys__RpId=${PASSKEYS_RP_ID}
      - Passkeys__RpName=${PASSKEYS_RP_NAME}
      - Passkeys__Origins__0=${PASSKEYS_ORIGIN}

volumes:
  sqlserver_data:
