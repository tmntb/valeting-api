name: Merge to Main

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - ReadMe.md
      - .swagger/**
  
permissions: write-all

jobs:
  build-test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build & Test
        uses: tmntb/valeting-api/.github/actions/build-test@main

  swagger-gen:
    name: Generate swagger
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: tmntb/valeting-api/.github/actions/swagger-update@main
        with:
          pat-bot-token: ${{ secrets.PAT_BOT_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }} 
          swagger-path: "swagger/swagger.json"
          target-dll-path: "Api/bin/Release/net10.0/Api.dll"
          swagger-version: "v1"
          target-branch: "swagger-update"
          sa-password: ${{ secrets.SA_PASSWORD }}
          jwt-key: ${{ secrets.JWT_KEY }}
    
  semantic-release:
    name: Create release
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic release
        id: semantic_release
        uses: cycjimmy/semantic-release-action@v5
        with:
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
