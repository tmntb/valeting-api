name: Pull-Request

on:
  pull_request:
    paths-ignore:
      - ReadMe.md

permissions: write-all

jobs:
  build-test:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build & Test
        uses: tmntb/valeting-api/.github/actions/build-test@main

  swagger-gen:
    name: Generate swagger
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: tmntb/valeting-api/.github/actions/swagger-update@hotfix/swagger-gen
        with:
          pat-bot-token: ${{ secrets.PAT_BOT_TOKEN }}
          pat-token: ${{ secrets.PAT_TOKEN }} 
          swagger-path: "swagger/swagger.json"
          target-dll-path: "Api/bin/Release/net10.0/Api.dll"
          swagger-version: "v1"
          target-branch: "swagger-update"
          sa-password: ${{ secrets.SA_PASSWORD }}
          jwt-key: ${{ secrets.JWT_KEY }}